name: Mschf Product Studio
description: >-
  MSCHF Product Studio, Inc. (pronounced "mischief") is a Brooklyn, New York-based art
  collective and product studio founded in 2016 by Gabriel Whaley. It is known for viral,
  limited-edition "drops" released roughly every two weeks — from the Big Red Boots to
  Satan Shoes, The Persistence of Chaos, and Tax Heaven 3000 — and operates primarily
  through its own website and brand partnerships. In 2025 it launched Applied MSCHF, an
  advertising agency. MSCHF is a portfolio company of Canaan Partners. No public developer
  API surface was found during enrichment; this remains a company/identity profile.
